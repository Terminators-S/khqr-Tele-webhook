services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: khqr_test
      POSTGRES_USER: khqr_test
      POSTGRES_PASSWORD: khqr_test
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - khqr_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khqr_test -d khqr_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  khqr_test_pg:
