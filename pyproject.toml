[project]
name = "khqr-self-develop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg2-binary>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
telegram = ["pyrogram>=2.0,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "khqr_sdk*"]

[tool.setuptools.package-data]
app = ["dashboard_ui/*.html", "dashboard_ui/*.css", "dashboard_ui/*.js"]
